# ==============================================================================
# DecisionHub Production Docker Compose with SSL/HTTPS & Automated Certbot
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: decisionhub-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decisionhub}
      POSTGRES_USER: ${POSTGRES_USER:-decisionhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decisionhub} -d ${POSTGRES_DB:-decisionhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - decisionhub-internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  backend:
    build:
      context: ./backend/springboot-project
      dockerfile: Dockerfile
    container_name: decisionhub-backend-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-decisionhub}
      DB_USERNAME: ${POSTGRES_USER:-decisionhub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-25}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      PASSWORD_RESET_FROM: ${PASSWORD_RESET_FROM:-no-reply@decisionhub.org}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-https://decisionhub.org/reset-password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://decisionhub.org,https://www.decisionhub.org}
      LOG_PATH: /app/logs
    volumes:
      - ./logs/backend-prod:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 1024M
    networks:
      - decisionhub-internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./decisionhub-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    container_name: decisionhub-frontend-prod
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-challenge:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || curl -k -f https://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - decisionhub-internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Optional Certbot companion service for automatic TLS certificate renewals
  certbot:
    image: certbot/certbot:latest
    container_name: decisionhub-certbot
    volumes:
      - certbot-challenge:/var/www/certbot:rw
      - ./nginx/ssl:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - decisionhub-internal

networks:
  decisionhub-internal:
    driver: bridge

volumes:
  postgres-prod-data:
    driver: local
  certbot-challenge:
    driver: local

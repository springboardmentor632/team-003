# AWS App Runner Service Specification for DecisionHub Backend
version: 1.0
runtime: custom
build:
  commands:
    build:
      - echo "Image provided via Amazon ECR"
run:
  command: java $JAVA_OPTS -jar /app/app.jar
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: STORAGE_PROVIDER
      value: s3
    - name: AWS_S3_REGION
      value: us-east-1
  secrets:
    - name: DB_URL
      value-from: "arn:aws:secretsmanager:us-east-1:YOUR_AWS_ACCOUNT_ID:secret:decisionhub/db_url"
    - name: DB_USERNAME
      value-from: "arn:aws:secretsmanager:us-east-1:YOUR_AWS_ACCOUNT_ID:secret:decisionhub/db_username"
    - name: DB_PASSWORD
      value-from: "arn:aws:secretsmanager:us-east-1:YOUR_AWS_ACCOUNT_ID:secret:decisionhub/db_password"
    - name: JWT_SECRET
      value-from: "arn:aws:secretsmanager:us-east-1:YOUR_AWS_ACCOUNT_ID:secret:decisionhub/jwt_secret"
    - name: AWS_S3_BUCKET
      value-from: "arn:aws:secretsmanager:us-east-1:YOUR_AWS_ACCOUNT_ID:secret:decisionhub/s3_bucket"

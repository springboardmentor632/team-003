version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: decisionhub_db
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # Spring Boot property overrides (relaxed binding)
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/decisionhub_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: devuser
      SPRING_DATASOURCE_PASSWORD: devpass
      JWT_SECRET: change_this_to_a_secure_long_random_value_at_least_32_chars
      JWT_EXPIRATION_MS: 86400000

volumes:
  db_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: decisionhub
      POSTGRES_USER: decisionhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionhub -d decisionhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/springboot-project
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/decisionhub
      DB_USERNAME: decisionhub
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in .env}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      PASSWORD_RESET_FROM: ${PASSWORD_RESET_FROM:?Set PASSWORD_RESET_FROM in .env}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost/reset-password}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./decisionhub-frontend
      args:
        VITE_API_BASE_URL: /
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres-data:

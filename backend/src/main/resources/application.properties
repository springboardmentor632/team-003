# Server
server.port=8080

# Datasource (replace username/password with your local MySQL credentials)
spring.datasource.url=jdbc:mysql://localhost:3306/decisionhub_db
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS: allowed origins for frontend (Vite dev)
app.cors.allowed-origins=http://localhost:5173

# JWT settings (replace with secure secret in local environment)
jwt.secret=CHANGE_ME_REPLACE_WITH_SECURE_SECRET
jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework=INFO

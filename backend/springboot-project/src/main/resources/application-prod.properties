# ==============================================================================
# DecisionHub Production Spring Boot Profile: application-prod.properties
# ==============================================================================

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/decisionhub}
spring.datasource.username=${DB_USERNAME:decisionhub}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP for high-concurrency production load)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=DecisionHub-Prod-HikariPool

# JPA / Hibernate in Production
# In production, automated DDL generation is validated against pre-migrated schema
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Settings
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=native

# JWT Security
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Mail Delivery (Production SMTP)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.password-reset.from=${PASSWORD_RESET_FROM:no-reply@decisionhub.org}
app.password-reset.url=${PASSWORD_RESET_URL:https://decisionhub.org/reset-password}
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,https://localhost,https://decisionhub.org}

# Spring Boot Actuator Monitoring & Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.info.env.enabled=true
management.metrics.export.simple.enabled=true

# Logging Level Defaults
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.decisionhub=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}

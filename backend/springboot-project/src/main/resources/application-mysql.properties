# Run with: SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/decisionhub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:decisionhub}
spring.datasource.password=${MYSQL_PASSWORD:decisionhub}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL runtime uses the same schema-update policy as PostgreSQL.
spring.jpa.hibernate.ddl-auto=update

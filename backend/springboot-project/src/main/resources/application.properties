# Default runtime database: PostgreSQL. Set DB_* values in the environment,
# never commit real credentials to this repository.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/decisionhub}
spring.datasource.username=${DB_USERNAME:decisionhub}
spring.datasource.password=${DB_PASSWORD:decisionhub}
spring.datasource.driver-class-name=org.postgresql.Driver

# Creates/updates the relational schema on the configured PostgreSQL instance.
# Replace with Flyway migrations before multi-environment production deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET:DecisionHubSecretKeyForDevelopmentOnly123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# SMTP credentials must be supplied as environment variables in real deployments.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.password-reset.from=${PASSWORD_RESET_FROM:no-reply@decisionhub.local}
app.password-reset.url=${PASSWORD_RESET_URL:http://127.0.0.1:3000/reset-password}
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:8081,http://localhost:8081,http://127.0.0.1,http://localhost}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}

# Spring Boot Actuator Monitoring & Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=DecisionHub Backend
info.app.description=Collaborative Decision Intelligence System
info.app.version=1.0.0

# Server Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# OAuth2 Google Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:decisionhub-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:decisionhub-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

app.oauth2.redirect-uri=${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth2/callback}

# File & Media Storage (AWS S3 / Cloudinary / Local Fallback)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
storage.provider=${STORAGE_PROVIDER:local}
storage.local.upload-dir=${STORAGE_LOCAL_UPLOAD_DIR:./uploads}

# AWS S3 Settings
aws.s3.bucket=${AWS_S3_BUCKET:decisionhub-storage}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}

# Cloudinary Settings
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:decisionhub-demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Firebase Cloud Messaging (FCM) Push Notifications
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.project-id=${FIREBASE_PROJECT_ID:decisionhub-team-003}
firebase.service-account-key=${FIREBASE_SERVICE_ACCOUNT_KEY:}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}



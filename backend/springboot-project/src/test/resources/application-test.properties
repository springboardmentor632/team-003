# Isolated test database only. Production/local runtime uses PostgreSQL or MySQL.
spring.datasource.url=jdbc:h2:mem:decisionhub-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable external mail server probe during test execution
management.health.mail.enabled=false

# Test OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.oauth2.redirect-uri=http://localhost:3000/oauth2/callback

# File Storage Test Configuration
storage.provider=local
storage.local.upload-dir=target/test-uploads
aws.s3.bucket=test-bucket
aws.s3.region=us-east-1
aws.s3.access-key=decisionhub-dummy-key
aws.s3.secret-key=decisionhub-dummy-secret
cloudinary.cloud-name=decisionhub-demo
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

# Firebase Test Configuration
firebase.enabled=true
firebase.project-id=decisionhub-test-project
firebase.service-account-key=
firebase.credentials-path=



